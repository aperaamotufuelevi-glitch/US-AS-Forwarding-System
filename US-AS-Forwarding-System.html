 b.innerHTML=`<p class="hint">To add an employee: ask them to open this system, create a login with their own email, and choose <b>"I'm an employee – request access"</b>. Their request appears here for you to approve and assign a role.</p>${tbl([['Name',p=>esc(p.name)],['Email',p=>esc(p.email)],['Status',p=>p.kind==='pending'?'<span class="pill warn">Waiting for approval</span>':p.kind==='disabled'?'<span class="pill">Disabled</span>':'<span class="pill ok">Active</span>'],['Role',p=>esc(p.role||'—')]],data,p=>`editEmp('${p.id}')`,'No employees yet.')}`}
function editEmp(id){const p=window.__emps.find(x=>x.id===id);const F=[{k:'name',label:'Name',req:1},{k:'kind',label:'Access',type:'select',opts:[['staff','Active'],['pending','Waiting'],['disabled','Disabled']],blank:false},{k:'role',label:'Role',type:'select',opts:ROLES,req:1}];
 modal('Employee – '+p.email,formHTML(F,p)+'<p class="hint mut">Employees only see the parts of the system their role needs. Database rules also enforce this.</p>',[{t:'Save',cls:'pri',fn:async m=>{const o=readForm(m,F);if(!o)return false;const admins=window.__emps.filter(x=>x.kind==='staff'&&x.role===SA&&x.id!==id).length;if(p.role===SA&&p.kind==='staff'&&(o.role!==SA||o.kind!=='staff')&&!admins){toast('Keep at least one active Super Admin.',1);return false}
  const {error}=await sb.from('profiles').update(o).eq('id',id);if(error)throw error;audit('Employee access changed',p.email,`${o.kind} · ${o.role}`);toast('Saved');setEmployees();if(id===ME.uid)afterLogin()}}])}
function setSecurity(){const S=D.settings;$('#sb3').innerHTML=`<h3>Two-step verification</h3><label class="chk"><input type="checkbox" id="mfa" ${S.security.requireMfa?'checked':''}> Require two-step verification (authenticator app) for Super Admin and Finance Officer logins</label><div class="row"><button class="btn pri" id="ms">Save</button><button class="btn" onclick="mfaSetup()">Set up my two-step verification</button></div>
 <h3 style="margin-top:20px">Backups</h3><p class="hint">Supabase backs up your database automatically (daily on paid plans). You can also download a full copy of all records here and keep it somewhere safe.</p><div class="row"><button class="btn" onclick="exportAll()">Download backup (JSON)</button></div>
 <h3 style="margin-top:20px">Database setup script</h3><p class="hint">Run again after updating this file if new features need database changes. It is safe to run more than once.</p><div class="row"><button class="btn" onclick="copySql()">Copy setup script</button><button class="btn" onclick="setupScreen()">Connection setup</button></div>`;
 $('#ms').onclick=async()=>{S.security.requireMfa=$('#mfa').checked;try{await saveSettings();audit('Security setting changed','MFA',String(S.security.requireMfa));toast('Saved')}catch(e){toast(e.message,1)}}}
async function exportAll(){try{await loadAll();const {data:a}=await sb.from('audit_log').select('*').order('id');const out={exported:now(),by:ME.email,settings:D.settings,audit:a||[]};TABLES.forEach(t=>out[t]=D[t].map(clean));const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=`forwarding-backup-${today()}.json`;l.click();audit('Backup downloaded')}catch(e){toast(e.message,1)}}

/* ============================ CUSTOMER PORTAL ============================ */
const me=()=>cust(ME.custId);
VIEWS.c_home=function(){const c=me();if(!c)return main('<p class="bad">Your customer record could not be loaded. Please contact the office.</p>');const S=D.settings,u=S.us;const ready=D.packages.filter(p=>p.status===14);const addr=[`${S.company.name} – ${c.fid}`,u.line1,u.line2,`${u.city}${u.city?', ':''}${u.state} ${u.zip}`].filter(x=>x&&x.trim()).join('\n');
 main(`<div class="bar"><h2>Welcome, ${esc(c.name)}</h2></div><div class="card"><div class="mut">Your forwarding ID</div><div class="big">${esc(c.fid)}</div><p>Use this U.S. address when you shop online. Your forwarding ID must appear on every package.</p>${u.line1?`<div class="addr">${esc(addr)}</div><div class="row"><button class="btn sm" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(addr))}).then(()=>toast('Address copied'))">Copy address</button><button class="btn sm" onclick="preview(addressCardDoc(ME.custId))">Print address card</button></div>`:'<p class="bad">Our U.S. warehouse address is being set up. Please check back soon.</p>'}<p class="hint mut">Enter your own name as the recipient and include ${esc(c.fid)} in the first address line.</p></div>
 ${ready.length?`<div class="card" style="border-color:#9fd3b5"><h3>Ready for pickup</h3><p>Pickup code: <span class="big" style="font-size:1.6rem">${esc(ready[0].code)}</span></p><p>${ready.map(p=>esc(p.id)).join(', ')} at ${esc(c.pickupLoc||'')}${S.as.pickupHours?' · '+esc(S.as.pickupHours):''}</p><p class="hint">${esc(S.policies.pickupId)}</p><div class="acts"><button class="btn" onclick="cDeliveryReq()">Request home delivery instead</button></div></div>`:''}
 <div class="stats"><div class="stat" onclick="go('c_packages')"><b>${D.packages.filter(p=>p.status<16).length}</b><span>Active packages</span></div><div class="stat" onclick="go('c_requests')"><b>${D.requests.filter(r=>r.status==='Quoted').length}</b><span>Quotations to review</span></div><div class="stat" onclick="go('c_billing')"><b>${money(custBal(c.id))}</b><span>Balance due</span></div></div>
 <div class="acts"><button class="btn pri" onclick="go('c_shop')">Shop catalog</button><button class="btn" onclick="editRequest(null,null,true)">Ask us to buy something</button><button class="btn" onclick="preAlert(null,true)">Tell us a package is coming</button></div>`)};
VIEWS.c_shop=function(){const cats=[...new Set(D.products.map(p=>p.category).filter(Boolean))];const n=state.cart.reduce((a,x)=>a+x.qty,0);main(`<div class="bar"><h2>Shop</h2><span class="sp"></span>${sbox('cShopList','Search products')}<select class="search" style="max-width:200px" onchange="state.cat=this.value;cShopList()"><option value="">All categories</option>${cats.map(c=>`<option ${state.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn pri" onclick="cartModal()">Cart (${n})</button></div><div id="list"></div>`);cShopList()};
function cShopList(){$('#list').innerHTML=prodGrid(D.products.filter(p=>p.active!==false&&(!state.cat||p.category===state.cat)&&qm(p.name,p.desc,p.category,p.sku)),true)}
function prodInfo(id){const p=find('products',id);modal(p.name,`${p.image?`<img src="${p.image}" alt="" style="max-width:100%;max-height:300px;display:block;margin:auto">`:''}<p class="big" style="font-size:1.4rem">${money(p.price)}</p><p class="mut">${p.confirmedOn?'Price last confirmed '+fd(p.confirmedOn):'Price not yet confirmed'} · final price is shown on your invoice before purchase</p><p style="white-space:pre-wrap">${esc(p.desc||'')}</p>`,[{t:'Add to cart',cls:'pri',fn:()=>addCart(id)}])}
const saveCart=()=>{try{localStorage.setItem('fds_cart_'+ME.uid,JSON.stringify(state.cart))}catch(e){}};
function addCart(id){const x=state.cart.find(c=>c.id===id);if(x)x.qty++;else state.cart.push({id,qty:1});saveCart();toast('Added to cart');render()}
function cartModal(){const items=state.cart.map(x=>({...x,p:find('products',x.id)})).filter(x=>x.p);const sub=items.reduce((a,x)=>a+x.qty*x.p.price,0);
 const m=modal('Your cart',items.length?`${tbl([['Product',x=>esc(x.p.name)],['Price',x=>money(x.p.price)],['Qty',x=>`<input type="number" min="0" value="${x.qty}" data-id="${x.id}" class="cq" style="width:70px">`],['Amount',x=>money(x.qty*x.p.price)]],items)}<p class="row"><span class="sp"></span><b>Catalog subtotal: ${money(sub)}</b></p><label class="fl"><span>Notes for our team</span><textarea id="cn"></textarea></label><p class="hint mut">Placing an order sends it to our team. We confirm price and availability with the retailer and send you an invoice that includes any sales tax and fees. Nothing is charged until you receive and pay the invoice.</p>`:'<p class="empty">Your cart is empty.</p>',[items.length?{t:'Place order',cls:'pri',fn:async m=>{const its=items.filter(x=>x.qty>0).map(x=>({productId:x.id,sku:x.p.sku,name:x.p.name,price:x.p.price,qty:x.qty}));if(!its.length){toast('Cart is empty',1);return false}const o={id:await nx('order'),custId:ME.custId,items:its,subtotal:r2(its.reduce((a,x)=>a+x.qty*x.price,0)),status:'Placed',placedAt:now(),notes:$('#cn',m).value.trim(),history:[{s:'Placed',at:now(),by:ME.name}]};await put('orders',o);audit('Online order placed',o.id,money(o.subtotal));state.cart=[];saveCart();toast('Order '+o.id+' placed');go('c_requests')}}:null]);
 m.querySelectorAll('.cq').forEach(i=>i.onchange=()=>{const x=state.cart.find(c=>c.id===i.dataset.id);x.qty=Math.max(0,+i.value||0);state.cart=state.cart.filter(c=>c.qty>0);saveCart();m.close();cartModal();render()})}
VIEWS.c_requests=function(){main(`<div class="bar"><h2>Buy For Me &amp; Orders</h2><span class="sp"></span><button class="btn pri" onclick="editRequest(null,null,true)">+ New request</button></div><p class="hint">Send us a product link from Amazon, Walmart, eBay, Target, Best Buy, Home Depot or another U.S. retailer. We reply with a complete quotation; nothing is bought until you approve it.</p><h3>Purchasing requests</h3>${tbl([['Request',r=>`<b>${esc(r.id)}</b>`],['Product',r=>esc(r.product)],['Retailer',r=>esc(r.retailer)],['Quote',r=>r.quote?money(r.quote.dueNow):'—'],['Status',r=>stPill(r.status)]],D.requests.slice().sort((a,b)=>b.id.localeCompare(a.id)),r=>`cReq('${r.id}')`,'No requests yet.')}<h3 style="margin-top:16px">Catalog orders</h3>${tbl([['Order',o=>`<b>${esc(o.id)}</b>`],['Placed',o=>fdt(o.placedAt)],['Items',o=>(o.items||[]).map(x=>x.qty+' × '+esc(x.name)).join('<br>')],['Catalog total',o=>money(o.subtotal)],['Invoice',o=>esc(o.invId||'—')],['Status',o=>stPill(o.status)]],D.orders.slice().sort((a,b)=>b.id.localeCompare(a.id)),null,'No orders yet.')}`)};
function cReq(id){const r=find('requests',id),q=r.quote;modal('Request '+id,`<div class="kv"><div><b>Product</b>${esc(r.product)}</div><div><b>Retailer</b>${esc(r.retailer)}</div><div><b>Qty</b>${r.qty}</div><div><b>Status</b>${stPill(r.status)}</div></div>${q?`<h4>Quotation ${esc(q.no)}</h4>${quoteTable(q)}${q.notes?`<p class="hint">${esc(q.notes)}</p>`:''}`:'<p class="hint">We are preparing your quotation.</p>'}${r.invId?`<p>Invoice: <a href="#" onclick="cInv('${r.invId}');return false">${r.invId}</a></p>`:''}`,[q?{t:'Print quotation',fn:()=>{preview(quoteDoc(id));return false}}:null,r.status==='Quoted'?{t:'Decline',fn:async()=>{if(!confirm('Decline this quotation?'))return false;await cReqSt(r,'Declined')}}:null,r.status==='Quoted'?{t:'Approve quotation',cls:'ok',fn:async()=>{if(!confirm(`Approve quotation ${q.no}? You agree to pay ${money(q.dueNow)} before purchase plus forwarding charges invoiced later on actual weight.`))return false;await cReqSt(r,'Approved')}}:null,r.status==='Submitted'?{t:'Cancel request',cls:'bad',fn:async()=>{if(!confirm('Cancel this request?'))return false;await cReqSt(r,'Cancelled')}}:null],{wide:1})}
async function cReqSt(r,s){const prev={status:r.status,approval:r.approval,history:r.history};r.status=s;if(s==='Approved')r.approval={by:ME.name,method:'Online account',at:now()};(r.history=r.history||[]).push({s,at:now(),by:ME.name});try{await put('requests',r);audit('Customer '+s.toLowerCase()+' request',r.id);toast('Request '+s.toLowerCase());render()}catch(e){Object.assign(r,prev);throw e}}
VIEWS.c_packages=function(){main(`<div class="bar"><h2>My Packages</h2><span class="sp"></span>${sbox('cPkgList','Search tracking or package ID')}<button class="btn pri" onclick="preAlert(null,true)">+ Pre-alert</button></div><div id="list"></div>`);cPkgList()};
function cPkgList(){$('#list').innerHTML=tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Retailer',p=>esc(p.retailer)],['Tracking',p=>esc(p.tracking||'—')],['Contents',p=>esc(p.desc)],['Status',p=>esc(STAT[p.status])+(p.status===14?` · code <b>${esc(p.code)}</b>`:'')],['Updated',p=>fdt(p.history?.at(-1)?.at)]],D.packages.filter(p=>qm(p.id,p.tracking,p.desc,p.retailer)).sort((a,b)=>b.id.localeCompare(a.id)),p=>`cPkg('${p.id}')`,'No packages yet.')}
function cPkg(id){const p=pkg(id);modal('Package '+id,`<div class="kv"><div><b>Status</b>${esc(STAT[p.status])}</div><div><b>Retailer</b>${esc(p.retailer)}</div><div><b>Carrier</b>${esc(p.carrier)}</div><div><b>Tracking</b>${esc(p.tracking)}</div><div><b>Weight</b>${p.weight?p.weight+' lb':'—'}</div><div><b>Dimensions</b>${dims(p)||'—'}</div>${p.status===14?`<div><b>Pickup code</b>${esc(p.code)}</div>`:''}<div><b>Balance on package</b>${money(pkgBalance(p))}</div></div><h4>Tracking history</h4><div class="tl">${(p.history||[]).slice().reverse().map(h=>`<div><b>${esc(STAT[h.s])}</b><br><small>${fdt(h.at)}</small></div>`).join('')}</div>`,[{t:'Print tracking report',fn:()=>{preview(trackingDoc(id));return false}},p.status===14&&!D.deliveries.some(d=>(d.pkgIds||[]).includes(id)&&['Requested','Scheduled','Out for delivery'].includes(d.status))?{t:'Request home delivery',fn:()=>{cDeliveryReq([id]);return true}}:null],{wide:1})}
function cDeliveryReq(ids){const c=me();ids=ids||D.packages.filter(p=>p.status===14).map(p=>p.id);const F=[{k:'prefDate',label:'Preferred date',type:'date',def:today(),req:1},{k:'contact',label:'Contact number',type:'tel',def:c.phone,req:1},{k:'village',label:'Village',type:'select',opts:D.settings.villages,def:c.village,req:1},{k:'instructions',label:'Directions / instructions',type:'textarea',full:1,def:c.deliveryInstr}];
 modal('Request home delivery',`<p>Packages: ${ids.map(esc).join(', ')}</p>${+D.settings.pricing.delivery?`<p class="hint">Delivery fee: ${money(D.settings.pricing.delivery)} (added to your account if scheduled).</p>`:''}`+formHTML(F),[{t:'Send request',cls:'pri',fn:async m=>{const o=readForm(m,F);if(!o)return false;const d={id:await nx('delivery'),custId:ME.custId,pkgIds:ids,...o,status:'Requested',created:now(),history:[{s:'Requested',at:now(),by:ME.name}]};await put('deliveries',d);audit('Home delivery requested',d.id);toast('Delivery request sent. We will contact you to confirm.');render()}}])}
VIEWS.c_billing=function(){main(`<div class="bar"><h2>Invoices &amp; Payments</h2><span class="sp"></span><button class="btn" onclick="statementPrompt(ME.custId)">Account statement</button></div><div class="stats"><div class="stat"><b>${money(custBal(ME.custId))}</b><span>Balance due</span></div></div><h3>Invoices</h3>${tbl([['Invoice',i=>`<b>${esc(i.id)}</b>`],['Type',i=>esc(i.type)],['Date',i=>fd(i.date)],['Total',i=>money(invT(i).total)],['Balance',i=>money(invT(i).balance)],['Status',i=>stPill(invSt(i))]],D.invoices.filter(i=>!i.void).sort((a,b)=>b.id.localeCompare(a.id)),i=>`cInv('${i.id}')`,'No invoices.')}<h3 style="margin-top:16px">Payments &amp; refunds</h3>${tbl([['Receipt',p=>esc(p.id)],['Type',p=>esc(p.type)],['Invoice',p=>esc(p.invId)],['Date',p=>fd(p.date)],['Method',p=>esc(p.method)],['Amount',p=>money(p.amount)]],D.payments.slice().sort((a,b)=>(b.at||'').localeCompare(a.at||'')),p=>`preview(receiptDoc('${p.id}'))`,'No payments yet.')}<p class="hint mut">${esc(D.settings.company.csInfo||'')}</p>`)};
function cInv(id){const i=inv(id);if(!i)return;const t=invT(i);modal('Invoice '+id,`${tbl([['Item',l=>esc(l.cat)],['Description',l=>esc(l.desc)],['Amount',l=>money(l.qty*l.unit)]],i.lines||[])}<div class="kv"><div><b>Total</b>${money(t.total)}</div><div><b>Paid</b>${money(t.net)}</div><div><b>Balance</b>${money(t.balance)}</div><div><b>Status</b>${stPill(invSt(i))}</div></div>${t.balance>0?`<p class="hint">${i.payLink?'Pay online with the button below, or pay':'Pay'} at our office${D.settings.as.hours?' ('+esc(D.settings.as.hours)+')':''}.</p>`:''}`,[{t:'Print invoice',fn:()=>{preview(invoiceDoc(id));return false}},i.payLink&&t.balance>0?{t:'Pay online',cls:'pri',fn:()=>{window.open(i.payLink,'_blank','noopener');return false}}:null],{wide:1})}
VIEWS.c_profile=function(){const c=me();const F=custFields(true);main(`<div class="bar"><h2>Profile</h2></div><div class="card"><p class="mut">Forwarding ID: <b>${esc(c.fid)}</b></p><div id="pf">${formHTML(F,c)}</div><div class="row"><button class="btn pri" id="ps">Save changes</button><button class="btn" onclick="changePw()">Change password</button><button class="btn" onclick="mfaSetup()">Two-step verification</button></div></div>`);
 $('#ps').onclick=async()=>{const o=readForm($('#pf'),F);if(!o)return;const prev={...c};Object.assign(c,o);try{await put('customers',c);audit('Customer updated own profile',c.fid);toast('Saved');render()}catch(e){Object.assign(c,prev);toast(e.message,1)}}};

boot().catch(e=>{console.error(e);fatal(e.message||String(e))});
</script>
