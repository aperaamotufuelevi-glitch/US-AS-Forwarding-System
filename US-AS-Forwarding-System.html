<script type="text/plain" id="setup-sql">
-- =====================================================================
-- Forwarding & Distribution System - database setup for Supabase
-- Paste into Supabase > SQL Editor > New query, then click Run.
-- Safe to run more than once (it only adds what is missing).
-- =====================================================================
create extension if not exists pgcrypto;

create table if not exists public.profiles(
  id uuid primary key references auth.users on delete cascade,
  kind text not null default 'none',          -- none | customer | staff | pending | disabled
  role text, name text, email text, customer_id text,
  created_at timestamptz not null default now());

create table if not exists public.app_settings(
  id int primary key default 1, data jsonb not null default '{}'::jsonb,
  ver int not null default 1, updated_at timestamptz not null default now(), updated_by uuid);
insert into public.app_settings(id) values (1) on conflict do nothing;

create table if not exists public.counters(key text primary key, prefix text not null, next bigint not null, pad int not null default 0);
insert into public.counters(key,prefix,next,pad) values
 ('customer','AS',100001,0),('package','PKG-',1,6),('request','REQ-',1,5),('quote','QUO-',1,5),
 ('invoice','INV-',1,6),('payment','RCP-',1,6),('refund','RFD-',1,5),('consolidation','CON-',1,5),
 ('shipment','SHP-',1,5),('pickup','PU-',1,6),('delivery','DLV-',1,5),('expense','EXP-',1,5),
 ('order','ORD-',1,5),('product','SKU-',1,5),('notification','NTF-',1,6)
on conflict (key) do nothing;

create table if not exists public.audit_log(
  id bigserial primary key, at timestamptz not null default now(),
  by_uid uuid, by_name text, role text, action text, ref text, detail text);

-- ---------- helper functions ----------
create or replace function public.touch() returns trigger language plpgsql as $$
begin new.ver := coalesce(old.ver,0)+1; new.updated_at := now(); new.updated_by := auth.uid(); return new; end $$;

create or replace function public.is_staff() returns boolean language sql stable security definer set search_path=public as $$
  select exists(select 1 from profiles where id=auth.uid() and kind='staff') $$;
create or replace function public.has_role(r text[]) returns boolean language sql stable security definer set search_path=public as $$
  select exists(select 1 from profiles where id=auth.uid() and kind='staff' and (role='Super Admin' or role = any(r))) $$;
create or replace function public.my_cust() returns text language sql stable security definer set search_path=public as $$
  select customer_id from profiles where id=auth.uid() and kind='customer' $$;
create or replace function public.staff_exists() returns boolean language sql stable security definer set search_path=public as $$
  select exists(select 1 from profiles where kind='staff' and role='Super Admin') $$;
create or replace function public.staff_directory() returns table(id uuid, name text, role text) language sql stable security definer set search_path=public as $$
  select p.id, p.name, p.role from profiles p where p.kind='staff' and public.is_staff() order by p.name $$;

-- ---------- record tables ----------
do $$ declare t text; begin
foreach t in array array['customers','products','orders','requests','packages','consolidations','shipments','invoices','payments','expenses','pickups','deliveries','notifications'] loop
  execute format('create table if not exists public.%I(id text primary key, cust_id text, data jsonb not null default ''{}''::jsonb, ver int not null default 1, created_at timestamptz not null default now(), updated_at timestamptz not null default now(), updated_by uuid)', t);
  execute format('create index if not exists %I on public.%I(cust_id)', t||'_cust_idx', t);
  execute format('alter table public.%I enable row level security', t);
  execute format('drop trigger if exists z_touch on public.%I', t);
  execute format('create trigger z_touch before update on public.%I for each row execute function public.touch()', t);
  execute format('drop policy if exists staff_read on public.%I', t);
  if t <> 'expenses' then execute format('create policy staff_read on public.%I for select using (public.is_staff())', t); end if;
  execute format('drop policy if exists admin_delete on public.%I', t);
  execute format('create policy admin_delete on public.%I for delete using (public.has_role(array[]::text[]))', t);
  execute format('drop policy if exists staff_write on public.%I', t);
  execute format('drop policy if exists staff_update on public.%I', t);
  if t not in ('payments','expenses') then
    execute format('create policy staff_write on public.%I for insert with check (public.is_staff())', t);
    execute format('create policy staff_update on public.%I for update using (public.is_staff()) with check (public.is_staff())', t);
  end if;
  execute format('drop policy if exists own_read on public.%I', t);
  if t in ('customers','orders','requests','packages','invoices','payments','pickups','deliveries') then
    execute format('create policy own_read on public.%I for select using (cust_id is not null and cust_id = public.my_cust())', t);
  end if;
end loop; end $$;

-- payments: Finance, Branch, Customer Service and Drivers record payments; only Finance records refunds / edits
drop policy if exists pay_insert on public.payments;
create policy pay_insert on public.payments for insert with check (
  public.has_role(array['Finance Officer','American Samoa Branch Manager','Customer Service','Delivery Driver'])
  and (data->>'type' = 'payment' or public.has_role(array['Finance Officer'])));
drop policy if exists pay_update on public.payments;
create policy pay_update on public.payments for update using (public.has_role(array['Finance Officer'])) with check (public.has_role(array['Finance Officer']));

-- expenses
drop policy if exists exp_read on public.expenses;
create policy exp_read on public.expenses for select using (public.has_role(array['Finance Officer','U.S. Purchasing Agent','U.S. Warehouse Manager','American Samoa Branch Manager']));
drop policy if exists exp_insert on public.expenses;
create policy exp_insert on public.expenses for insert with check (public.has_role(array['Finance Officer','U.S. Purchasing Agent','U.S. Warehouse Manager','American Samoa Branch Manager']));
drop policy if exists exp_update on public.expenses;
create policy exp_update on public.expenses for update using (public.has_role(array['Finance Officer'])) with check (public.has_role(array['Finance Officer']));

-- public catalog
drop policy if exists public_read on public.products;
create policy public_read on public.products for select using (coalesce((data->>'active')::boolean, true));

-- what customers may create or change themselves
drop policy if exists cust_insert on public.requests;
create policy cust_insert on public.requests for insert with check (cust_id = public.my_cust() and data->>'status' = 'Submitted');
drop policy if exists cust_update on public.requests;
create policy cust_update on public.requests for update using (cust_id = public.my_cust()) with check (cust_id = public.my_cust());
drop policy if exists cust_insert on public.orders;
create policy cust_insert on public.orders for insert with check (cust_id = public.my_cust() and data->>'status' = 'Placed');
drop policy if exists cust_insert on public.packages;
create policy cust_insert on public.packages for insert with check (cust_id = public.my_cust() and (data->>'status')::int between 1 and 3);
drop policy if exists cust_insert on public.deliveries;
create policy cust_insert on public.deliveries for insert with check (cust_id = public.my_cust() and data->>'status' = 'Requested');
drop policy if exists cust_update on public.customers;
create policy cust_update on public.customers for update using (cust_id = public.my_cust()) with check (cust_id = public.my_cust());

create or replace function public.guard_cust() returns trigger language plpgsql security definer set search_path=public as $$
begin
  if public.is_staff() then return new; end if;
  if tg_table_name = 'customers' then
    if new.id <> old.id or new.cust_id is distinct from old.cust_id or (new.data->>'fid') is distinct from (old.data->>'fid') then
      raise exception 'Not allowed'; end if;
    new.data := jsonb_set(jsonb_set(new.data,'{phoneVerified}',coalesce(old.data->'phoneVerified','false'::jsonb)),'{emailVerified}',coalesce(old.data->'emailVerified','false'::jsonb));
  elsif tg_table_name = 'requests' then
    if not ((old.data->>'status'='Quoted' and new.data->>'status' in ('Approved','Declined'))
         or (old.data->>'status'='Submitted' and new.data->>'status'='Cancelled')) then
      raise exception 'This request can no longer be changed online'; end if;
    if (new.data - 'status' - 'approval' - 'history') <> (old.data - 'status' - 'approval' - 'history') then
      raise exception 'Not allowed'; end if;
  end if;
  return new;
end $$;
drop trigger if exists a_guard on public.customers;
create trigger a_guard before update on public.customers for each row execute function public.guard_cust();
drop trigger if exists a_guard on public.requests;
create trigger a_guard before update on public.requests for each row execute function public.guard_cust();

-- settings, counters, profiles, audit
alter table public.app_settings enable row level security;
drop trigger if exists z_touch on public.app_settings;
create trigger z_touch before update on public.app_settings for each row execute function public.touch();
drop policy if exists read_all on public.app_settings;
create policy read_all on public.app_settings for select using (true);
drop policy if exists admin_update on public.app_settings;
create policy admin_update on public.app_settings for update using (public.has_role(array[]::text[])) with check (public.has_role(array[]::text[]));

alter table public.counters enable row level security;
drop policy if exists admin_all on public.counters;
create policy admin_all on public.counters for all using (public.has_role(array[]::text[])) with check (public.has_role(array[]::text[]));

alter table public.profiles enable row level security;
drop policy if exists own_or_admin on public.profiles;
create policy own_or_admin on public.profiles for select using (id = auth.uid() or public.has_role(array[]::text[]));
drop policy if exists admin_update on public.profiles;
create policy admin_update on public.profiles for update using (public.has_role(array[]::text[])) with check (public.has_role(array[]::text[]));

alter table public.audit_log enable row level security;
drop policy if exists self_insert on public.audit_log;
create policy self_insert on public.audit_log for insert with check (by_uid = auth.uid());
drop policy if exists admin_read on public.audit_log;
create policy admin_read on public.audit_log for select using (public.has_role(array[]::text[]));

-- ---------- account functions ----------
create or replace function public.next_no(k text) returns text language plpgsql security definer set search_path=public as $$
declare r public.counters; n text; begin
  if not public.is_staff() and (public.my_cust() is null or k not in ('package','request','order','delivery')) then raise exception 'Not allowed'; end if;
  update public.counters set next = next + 1 where key = k returning * into r;
  if not found then raise exception 'Unknown number series %', k; end if;
  n := (r.next - 1)::text;
  return r.prefix || case when length(n) >= r.pad then n else lpad(n, r.pad, '0') end;
end $$;

create or replace function public.register_customer(d jsonb) returns text language plpgsql security definer set search_path=public as $$
declare cid text; f text; em text; begin
  if auth.uid() is null then raise exception 'Sign in first'; end if;
  if exists(select 1 from profiles where id=auth.uid() and kind in ('staff','customer','pending')) then raise exception 'This login already has an account'; end if;
  select email into em from auth.users where id=auth.uid();
  update counters set next = next + 1 where key='customer' returning prefix || (next-1)::text into f;
  cid := 'C' || replace(gen_random_uuid()::text,'-','');
  insert into customers(id,cust_id,data) values (cid, cid,
    (d - 'phoneVerified' - 'emailVerified' - 'fid' - 'id') || jsonb_build_object('id',cid,'fid',f,'created',now(),'emailVerified',true,'selfRegistered',true,'loginEmail',em));
  insert into profiles(id,kind,name,email,customer_id) values (auth.uid(),'customer',d->>'name',em,cid)
    on conflict (id) do update set kind='customer', name=excluded.name, email=excluded.email, customer_id=excluded.customer_id;
  insert into audit_log(by_uid,by_name,role,action,ref) values (auth.uid(), d->>'name','Customer','Customer self-registered', f);
  return f;
end $$;

create or replace function public.link_customer(p_fid text, p_phone text) returns text language plpgsql security definer set search_path=public as $$
declare c record; em text; digits text := regexp_replace(coalesce(p_phone,''),'[^0-9]','','g'); begin
  if auth.uid() is null then raise exception 'Sign in first'; end if;
  if exists(select 1 from profiles where id=auth.uid() and kind in ('staff','customer','pending')) then raise exception 'This login already has an account'; end if;
  if length(digits) < 7 then raise exception 'Enter the full phone number on file'; end if;
  select * into c from customers where upper(data->>'fid') = upper(trim(p_fid))
     and regexp_replace(coalesce(data->>'phone',''),'[^0-9]','','g') = digits;
  if not found then raise exception 'No match. Check your forwarding ID and the phone number on file, or contact our office.'; end if;
  if exists(select 1 from profiles where customer_id = c.id) then raise exception 'This customer ID is already linked to another login. Contact our office.'; end if;
  select email into em from auth.users where id=auth.uid();
  insert into profiles(id,kind,name,email,customer_id) values (auth.uid(),'customer',c.data->>'name',em,c.id)
    on conflict (id) do update set kind='customer', name=excluded.name, email=excluded.email, customer_id=excluded.customer_id;
  insert into audit_log(by_uid,by_name,role,action,ref) values (auth.uid(), c.data->>'name','Customer','Customer linked online login', c.data->>'fid');
  return c.data->>'fid';
end $$;

create or replace function public.request_staff(p_name text) returns void language plpgsql security definer set search_path=public as $$
declare em text; begin
  if auth.uid() is null then raise exception 'Sign in first'; end if;
  if exists(select 1 from profiles where id=auth.uid() and kind in ('staff','customer')) then raise exception 'This login already has an account'; end if;
  select email into em from auth.users where id=auth.uid();
  insert into profiles(id,kind,name,email) values (auth.uid(),'pending',p_name,em)
    on conflict (id) do update set kind='pending', name=excluded.name;
end $$;

create or replace function public.claim_super_admin(p_name text) returns void language plpgsql security definer set search_path=public as $$
declare em text; begin
  if auth.uid() is null then raise exception 'Sign in first'; end if;
  if public.staff_exists() then raise exception 'A Super Admin already exists'; end if;
  select email into em from auth.users where id=auth.uid();
  insert into profiles(id,kind,role,name,email) values (auth.uid(),'staff','Super Admin',p_name,em)
    on conflict (id) do update set kind='staff', role='Super Admin', name=excluded.name;
  insert into audit_log(by_uid,by_name,role,action) values (auth.uid(), p_name,'Super Admin','Initial Super Admin account created');
end $$;

drop policy if exists "fds admin delete" on storage.objects;

 const close=()=>{m.remove();o.onClose&&o.onClose()};m.close=close;const f=m.querySelector('.mf');
 [...btns.filter(Boolean),o.noClose?null:{t:o.closeText||'Close',cls:'ghost',fn:()=>true}].filter(Boolean).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.textContent=b.t;e.onclick=async()=>{e.disabled=true;let r;try{r=await b.fn(m)}catch(err){console.error(err);toast(err.message||String(err),1);r=false}e.disabled=false;if(r!==false&&document.body.contains(m))close()};f.appendChild(e)});
 m.querySelector('.x').onclick=close;document.body.appendChild(m);return m}
const tabSel=(key,def)=>state.tab[key]||def;
function tabs(key,list){const t=tabSel(key,list[0][0]);return `<div class="tabs">${list.map(([k,l])=>`<button class="${t===k?'on':''}" onclick="state.tab['${key}']='${k}';render()">${l}</button>`).join('')}</div>`}
function tbl(cols,rows,onRow,empty='No records yet.'){if(!rows.length)return `<p class="empty">${empty}</p>`;return `<div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ${onRow?`class="click" onclick="${onRow(r)}"`:''}>${cols.map(c=>`<td>${c[1](r)??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const sbox=(fn,ph='Search…')=>`<input class="search" value="${esc(state.q)}" placeholder="${esc(ph)}" oninput="state.q=this.value;${fn}()">`;
const qm=(...f)=>{const q=state.q.trim().toLowerCase();return !q||f.some(x=>String(x??'').toLowerCase().includes(q))};
const main=h=>{$('#main').innerHTML=h};
function phHTML(label='Photographs'){return `<div class="full" style="margin-top:10px"><b class="mut" style="font-size:.85rem">${label}</b><div class="phs"></div><label class="btn sm">Add photos<input type="file" accept="image/*" multiple hidden class="phin"></label></div>`}
function bindPh(m,arr,max=1200){const box=m.querySelector('.phs');const draw=async()=>{const urls=await signed(arr);box.innerHTML=arr.length?arr.map((s,i)=>`<span class="th"><img src="${urls[i]||''}" alt="Photo ${i+1}"><button type="button" data-i="${i}" aria-label="Remove">×</button></span>`).join(''):'<small class="mut">No photos yet</small>';box.querySelectorAll('button').forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);draw()})};draw();
 m.querySelector('.phin').onchange=async e=>{for(const f of e.target.files){try{arr.push(await imgFile(f,max))}catch(_){toast('Could not read an image',1)}}e.target.value='';draw()}}
function sigPad(c){const x=c.getContext('2d');let d=false,has=false;const fit=()=>{const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;x.scale(2,2);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#111'};setTimeout(fit,30);
 const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{d=true;has=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))};c.onpointermove=e=>{if(!d)return;x.lineTo(...pos(e));x.stroke()};c.onpointerup=c.onpointercancel=()=>d=false;
 return{get:()=>has?c.toDataURL('image/png'):'',clear:()=>{x.clearRect(0,0,c.width,c.height);has=false}}}
function lineEd(el,ls){const draw=()=>{const tot=ls.reduce((a,l)=>a+r2((+l.qty||0)*(+l.unit||0)),0);el.innerHTML=`<div class="tw"><table class="t le"><thead><tr><th>Category</th><th>Description</th><th>Qty</th><th>Unit $</th><th>Pass-through</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>${ls.map((l,i)=>`<tr data-i="${i}"><td><select data-k="cat">${CATS.map(c=>`<option ${c===l.cat?'selected':''}>${c}</option>`).join('')}</select></td><td><input data-k="desc" value="${esc(l.desc)}"></td><td><input data-k="qty" type="number" step="any" value="${l.qty}"></td><td><input data-k="unit" type="number" step="0.01" value="${l.unit}"></td><td style="text-align:center"><input data-k="pass" type="checkbox" ${l.pass?'checked':''} style="width:auto"></td><td style="text-align:right">${money((+l.qty||0)*(+l.unit||0))}</td><td><button type="button" class="btn sm ghost" data-del aria-label="Remove line">×</button></td></tr>`).join('')}</tbody></table></div><div class="row"><button type="button" class="btn sm" data-add>+ Add line</button><span class="sp"></span><b>Total: ${money(tot)}</b></div><p class="hint mut">Pass-through = amounts collected on behalf of retailers, carriers or customs (not company revenue).</p>`;
 el.querySelectorAll('tr[data-i]').forEach(tr=>{const l=ls[+tr.dataset.i];tr.querySelectorAll('[data-k]').forEach(inp=>{inp.onchange=()=>{const k=inp.dataset.k;l[k]=k==='pass'?inp.checked:(k==='qty'||k==='unit')?+inp.value:inp.value;if(k==='cat')l.pass=PASS_CATS.includes(l.cat);draw()}});tr.querySelector('[data-del]').onclick=()=>{ls.splice(+tr.dataset.i,1);draw()}});
 el.querySelector('[data-add]').onclick=()=>{ls.push({cat:'Other disclosed service',desc:'',qty:1,unit:0,pass:false});draw()}};draw();return ls}

/* ============================ BOOT & AUTH ============================ */
function screen(html,wide){document.body.innerHTML=`<div class="center"><div class="authbox ${wide?'wide':''}">${html}</div></div><div id="toast"></div>`}
function brandHead(){const c=D.settings.company;return `${c.logo?`<img class="logo-lg" src="${c.logo}" alt="">`:''}<h2 style="text-align:center">${esc(c.name)}</h2><p class="mut" style="text-align:center;margin:4px 0 16px">U.S. – American Samoa Shopping, Forwarding &amp; Distribution</p>`}
function fatal(msg){screen(`<h2>Something went wrong</h2><p>${esc(msg)}</p><button class="btn pri" onclick="location.reload()">Reload</button> <button class="btn" onclick="setupScreen()">Connection setup</button>`)}
function setupScreen(note){const sql=SETUP_SQL;const c=getCfg()||{};
 screen(`<h2>Connect this system to your database</h2>${note?`<p class="bad">${esc(note)}</p>`:''}
 <ol style="padding-left:18px;line-height:1.7">
 <li>Create a free account at <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a> and start a <b>New project</b>.</li>
 <li>In the project open <b>SQL Editor → New query</b>, paste the setup script below, and click <b>Run</b>.</li>
 <li>Open <b>Authentication → URL Configuration</b> and set <b>Site URL</b> to the web address where this file is hosted (for example your GitHub Pages link). Add the same address under <b>Redirect URLs</b>. Email confirmation and password-reset links use it.</li>
 <li>Click the green <b>Connect</b> button at the top of your Supabase project (or <b>Project Settings → API Keys → Legacy API Keys</b>). Copy the <b>Project URL</b> (ends in <code>.supabase.co</code>) into the first box and the <b>anon public</b> key (a long code starting with <code>eyJ</code>) into the second box. Never use the <b>service_role / secret</b> key.</li>
 <li>Optional: put the same two values in the <code>CONFIG</code> line near the top of this file before uploading it, so nobody has to enter them.</li></ol>
 <div class="row"><b>Setup script</b><span class="sp"></span><button class="btn sm pri" onclick="copySql()">Copy script</button><button class="btn sm" onclick="dlSql()">Download .sql</button></div>
 <textarea class="code" readonly>${esc(sql)}</textarea>
 <div class="grid" style="margin-top:12px"><label class="fl full"><span>Project URL</span><input id="cu" value="${esc(c.url||'https://aonwmwnujbkotbadliht.supabase.co')}" placeholder="https://xxxx.supabase.co"></label><label class="fl full"><span>anon public key (NOT the URL)</span><input id="ck" value="${esc(/^https?:/.test(c.key||'')?'':(c.key||''))}" placeholder="starts with eyJ… or sb_publishable_…"><small>Supabase: Connect button (top of project) or Project Settings → API Keys. It is a long code, not a web address.</small></label></div>
 <div class="row"><button class="btn pri" onclick="saveCfg()">Save &amp; connect</button>${getCfg()?'<button class="btn" onclick="location.reload()">Back</button>':''}</div>`,true)}
function copySql(){if(!SETUP_SQL)return toast('Setup script missing from this file',1);(navigator.clipboard?navigator.clipboard.writeText(SETUP_SQL):Promise.reject()).then(()=>toast('Script copied – now paste it into Supabase SQL Editor and click Run')).catch(()=>{const t=document.querySelector('textarea.code');if(t){t.focus();t.select();document.execCommand('copy');toast('Script copied')}})}
function dlSql(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([SETUP_SQL],{type:'text/plain'}));a.download='forwarding-setup.sql';a.click()}
function saveCfg(){let url=$('#cu').value.replace(/\s+/g,'').replace(/\/+$/,'').replace(/\/rest\/v1$/,''),key=$('#ck').value.replace(/\s+/g,'').replace(/^["']|["']$/g,'');
 if(/^[a-z0-9]{20}$/.test(url))url=`https://${url}.supabase.co`;
 if(!/^https:\/\/[^/]+$/.test(url))return toast('Enter the Project URL, like https://xxxx.supabase.co',1);
 if(/^https?:/i.test(key)||/supabase\.co/.test(key))return toast('The key box has a web address in it. Paste the anon public key there — a long code starting with eyJ or sb_publishable_.',1);
 if(/^sb_secret_/.test(key)||/service_role/.test(atobSafe(key.split('.')[1])))return toast('That is the SECRET key. Use the anon public or publishable key instead.',1);
 if(!(/^sb_publishable_/.test(key)||/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(key)))return toast('That key looks incomplete. Copy it again with the copy button in Supabase.',1);
 const ref=(atobSafe(key.split('.')[1]).match(/"ref":"([a-z0-9]+)"/)||[])[1];if(ref&&!url.includes(ref))return toast(`This key belongs to a different project (${ref}). Use the key from the same project as the URL.`,1);
 localStorage.setItem('fds_cfg',JSON.stringify({url,key}));location.reload()}
function atobSafe(s){try{return atob(String(s||'').replace(/-/g,'+').replace(/_/g,'/'))}catch(e){return ''}}
async function boot(){const cfg=getCfg();if(!cfg)return setupScreen();if(!window.supabase)return fatal('The Supabase library could not load. Check the internet connection and reload.');
 sb=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 let recovering=/type=recovery/.test(location.hash);
 sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;recoveryScreen()}});
 try{await loadSettings()}catch(e){if(/invalid api key|no api key|jwt|unauthorized|secret api key/i.test(e.message))return setupScreen('Supabase rejected the key ("'+e.message+'"). Copy the anon public (or publishable) key again from the same project and paste it below.');
  if(/failed to fetch|networkerror|load failed/i.test(e.message))return setupScreen('Could not reach that Project URL. Check the URL below and your internet connection.');
  if(/app_settings|relation|schema cache|does not exist/i.test(e.message))return setupScreen('The database is reachable but not set up yet. Run the setup script (step 2), then reload.');return fatal(e.message)}
 const {data:{session}}=await sb.auth.getSession();if(recovering)return recoveryScreen();if(!session)return authScreen();await afterLogin()}
function authScreen(tab='in'){const t=(k,l)=>`<button class="${tab===k?'on':''}" onclick="authScreen('${k}')">${l}</button>`;
 let body='';
 if(tab==='in')body=`<div class="grid"><label class="fl full"><span>Email</span><input id="ae" type="email" autocomplete="email"></label><label class="fl full"><span>Password</span><input id="ap" type="password" autocomplete="current-password"></label></div><div class="row"><button class="btn pri" onclick="doSignIn()">Sign in</button></div>`;
 if(tab==='up')body=`<p class="hint">Create a login for yourself. After confirming your email you can register as a customer, link an existing customer ID, or request employee access.</p><div class="grid"><label class="fl full"><span>Email</span><input id="ae" type="email" autocomplete="email"></label><label class="fl full"><span>Password (at least 8 characters)</span><input id="ap" type="password" autocomplete="new-password"></label><label class="fl full"><span>Confirm password</span><input id="ap2" type="password" autocomplete="new-password"></label></div><div class="row"><button class="btn pri" onclick="doSignUp()">Create login</button></div>`;
 if(tab==='fp')body=`<div class="grid"><label class="fl full"><span>Email</span><input id="ae" type="email" autocomplete="email"></label></div><div class="row"><button class="btn pri" onclick="doReset()">Send reset link</button></div>`;
 screen(`${brandHead()}<div class="tabs">${t('in','Sign in')}${t('up','Create account')}${t('fp','Forgot password')}</div>${body}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn ghost" onclick="publicCatalog()">Browse our catalog</button>`)}
const redirect=()=>location.href.split('#')[0];
async function doSignIn(){const email=$('#ae').value.trim(),password=$('#ap').value;if(!email||!password)return toast('Enter email and password',1);const {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message,1);await afterLogin()}
async function doSignUp(){const email=$('#ae').value.trim(),p=$('#ap').value;if(!email)return toast('Enter your email',1);if(p.length<8)return toast('Password must be at least 8 characters',1);if(p!==$('#ap2').value)return toast('Passwords do not match',1);const {data,error}=await sb.auth.signUp({email,password:p,options:{emailRedirectTo:redirect()}});if(error)return toast(error.message,1);if(data.session)return afterLogin();screen(`${brandHead()}<h3>Check your email</h3><p>We sent a confirmation link to <b>${esc(email)}</b>. Open it to verify your email, then sign in.</p><button class="btn pri" onclick="authScreen()">Back to sign in</button>`)}
async function doReset(){const email=$('#ae').value.trim();if(!email)return toast('Enter your email',1);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect()});if(error)return toast(error.message,1);toast('If that email has an account, a reset link was sent.')}
function recoveryScreen(){screen(`${brandHead()}<h3>Set a new password</h3><div class="grid"><label class="fl full"><span>New password (at least 8 characters)</span><input id="np" type="password" autocomplete="new-password"></label><label class="fl full"><span>Confirm</span><input id="np2" type="password"></label></div><div class="row"><button class="btn pri" onclick="setNewPw()">Save password</button></div>`)}
async function setNewPw(){const p=$('#np').value;if(p.length<8)return toast('At least 8 characters',1);if(p!==$('#np2').value)return toast('Passwords do not match',1);const {error}=await sb.auth.updateUser({password:p});if(error)return toast(error.message,1);history.replaceState(null,'',redirect());toast('Password updated');await afterLogin()}
async function signOut(){await sb.auth.signOut();ME=null;TABLES.forEach(t=>D[t]=[]);authScreen()}
async function afterLogin(){const {data:{user}}=await sb.auth.getUser();if(!user)return authScreen();
 const {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 ME={uid:user.id,email:user.email,name:prof?.name||user.email,kind:prof?.kind||'none',role:prof?.kind==='staff'?prof.role:(prof?.kind==='customer'?'Customer':''),custId:prof?.customer_id||null};
 if(ME.kind==='none')return onboardScreen();
 if(ME.kind==='pending')return msgScreen('Your employee access request was received. A Super Admin must approve it and assign your role. Sign in again after you are approved.');
 if(ME.kind==='disabled')return msgScreen('This account is disabled. Contact the office.');
 if(ME.kind==='staff'&&D.settings.security.requireMfa&&[SA,FO].includes(ME.role)){if(!(await mfaGate()))return}
 try{state.cart=JSON.parse(localStorage.getItem('fds_cart_'+ME.uid)||'[]')}catch(e){state.cart=[]}
 shell();try{await loadAll()}catch(e){toast('Could not load data: '+e.message,1)}render()}
function msgScreen(msg){screen(`${brandHead()}<p>${esc(msg)}</p><div class="row"><button class="btn pri" onclick="afterLogin()">Check again</button><button class="btn" onclick="signOut()">Sign out</button></div>`)}
async function onboardScreen(mode){const {data:hasAdmin}=await sb.rpc('staff_exists');
 if(!mode){screen(`${brandHead()}<h3>Finish setting up your account</h3><p class="mut">Signed in as ${esc(ME.email)}</p><div class="acts" style="flex-direction:column;align-items:stretch">
 <button class="btn pri" onclick="onboardScreen('new')">I'm a new customer – register</button>
 <button class="btn" onclick="onboardScreen('link')">I already have a forwarding ID from the office</button>
 <button class="btn" onclick="onboardScreen('staff')">I'm an employee – request access</button>
 ${hasAdmin?'':'<button class="btn ok" onclick="onboardScreen(\'admin\')">First-time setup: make me the Super Admin</button>'}
 <button class="btn ghost" onclick="signOut()">Sign out</button></div>`);return}
 if(mode==='new'){const F=custFields(true);screen(`${brandHead()}<h3>Customer registration</h3><p class="hint">Your unique forwarding ID is created as soon as you register. You will use it on every package you send to our U.S. warehouse.</p><div id="rf">${formHTML(F,{marital:'Not stated',zip:D.settings.defaultZip})}</div><div class="row"><button class="btn pri" id="rb">Register</button><button class="btn ghost" onclick="onboardScreen()">Back</button></div>`,true);
  $('#rb').onclick=async()=>{const o=readForm($('#rf'),F);if(!o)return;$('#rb').disabled=true;const {data,error}=await sb.rpc('register_customer',{d:o});$('#rb').disabled=false;if(error)return toast(error.message,1);toast('Registered. Your forwarding ID is '+data);afterLogin()};return}
 if(mode==='link'){screen(`${brandHead()}<h3>Link your existing customer account</h3><div class="grid"><label class="fl"><span>Forwarding ID</span><input id="lf" placeholder="AS100001"></label><label class="fl"><span>Phone number on file</span><input id="lp" type="tel"></label></div><div class="row"><button class="btn pri" id="lb">Link account</button><button class="btn ghost" onclick="onboardScreen()">Back</button></div>`);
  $('#lb').onclick=async()=>{const {error}=await sb.rpc('link_customer',{p_fid:$('#lf').value,p_phone:$('#lp').value});if(error)return toast(error.message,1);toast('Account linked');afterLogin()};return}
 if(mode==='staff'||mode==='admin'){screen(`${brandHead()}<h3>${mode==='admin'?'Create the Super Admin account':'Employee access request'}</h3><div class="grid"><label class="fl full"><span>Your full name</span><input id="sn"></label></div><div class="row"><button class="btn pri" id="sb2">${mode==='admin'?'Become Super Admin':'Send request'}</button><button class="btn ghost" onclick="onboardScreen()">Back</button></div>`);
  $('#sb2').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return toast('Enter your name',1);const {error}=await sb.rpc(mode==='admin'?'claim_super_admin':'request_staff',{p_name:n});if(error)return toast(error.message,1);afterLogin()}}}
async function mfaGate(){const {data:a}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(a?.currentLevel==='aal2')return true;
 const {data:f}=await sb.auth.mfa.listFactors();const totp=(f?.totp||[]).find(x=>x.status==='verified');
 return new Promise(async resolve=>{
  if(totp){screen(`${brandHead()}<h3>Two-step verification</h3><p>Enter the 6-digit code from your authenticator app.</p><input id="mc" class="search" inputmode="numeric" maxlength="6" style="max-width:200px"><div class="row"><button class="btn pri" id="mv">Verify</button><button class="btn ghost" onclick="signOut()">Sign out</button></div>`);
   $('#mv').onclick=async()=>{const {error}=await sb.auth.mfa.challengeAndVerify({factorId:totp.id,code:$('#mc').value.trim()});if(error)return toast(error.message,1);resolve(true)}}
  else{const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Authenticator '+Date.now()});if(error){fatal(error.message);return resolve(false)}
   screen(`${brandHead()}<h3>Set up two-step verification</h3><p>Your role requires it. Scan this code with an authenticator app (Google Authenticator, Microsoft Authenticator, Authy), then enter the 6-digit code.</p><img src="${data.totp.qr_code}" alt="QR code" style="width:200px;height:200px;display:block;margin:auto"><p class="hint mut" style="word-break:break-all">Setup key: ${esc(data.totp.secret)}</p><input id="mc" class="search" inputmode="numeric" maxlength="6" style="max-width:200px"><div class="row"><button class="btn pri" id="mv">Verify &amp; continue</button><button class="btn ghost" onclick="signOut()">Sign out</button></div>`);
   $('#mv').onclick=async()=>{const {error:e2}=await sb.auth.mfa.challengeAndVerify({factorId:data.id,code:$('#mc').value.trim()});if(e2)return toast(e2.message,1);resolve(true)}}})}
async function publicCatalog(){let prods=[];try{prods=await loadTable('products')}catch(e){toast(e.message,1)}
 screen(`${brandHead()}<div class="bar"><h3>Catalog</h3><span class="sp"></span><button class="btn pri" onclick="authScreen()">Sign in to order</button></div>${prodGrid(prods.filter(p=>p.active!==false),false)}`,true)}

/* ============================ SHELL ============================ */
function shell(){document.body.innerHTML=`<header class="top"><button class="ham" onclick="document.body.classList.toggle('navopen')" aria-label="Menu">☰</button><div class="brand" id="brand"></div><span class="sp"></span><button class="btn sm ghost" onclick="refresh()" title="Refresh data">↻ Refresh</button><button class="who" id="who" onclick="acctMenu()"></button></header><nav id="nav"></nav><main id="main"></main><div id="toast"></div>`;state.view=ME.kind==='customer'?'c_home':'dash'}
const VIEWS={};
function badge(k){let n=0;if(k==='receiving')n=D.packages.filter(p=>p.unidentified&&p.status<10).length;if(k==='pickup')n=D.packages.filter(p=>p.status===14).length;if(k==='requests')n=D.requests.filter(r=>r.status==='Submitted').length;if(k==='catalog')n=D.orders.filter(o=>o.status==='Placed').length;if(k==='delivery')n=D.deliveries.filter(d=>d.status==='Requested').length;return n?`<span class="nb">${n}</span>`:''}
function render(){if(!$('#main'))return;const s=D.settings;$('#brand').innerHTML=(s.company.logo?`<img src="${s.company.logo}" alt="">`:'')+`<span>${esc(s.company.name)}</span>`;$('#who').textContent=`${ME.name} · ${ME.role}`;
 let items;if(ME.kind==='customer')items=CNAV;else items=NAV.filter(n=>ME.role===SA||n[2].includes(ME.role));
 if(!items.find(n=>n[0]===state.view))state.view=items[0][0];
 $('#nav').innerHTML=items.map(n=>`<a href="#" class="${state.view===n[0]?'on':''}" onclick="go('${n[0]}');return false"><span>${n[1]}</span>${ME.kind==='staff'?badge(n[0]):''}</a>`).join('')+`<div class="navfoot">${ME.kind==='staff'?'Shared database · changes are visible to all staff.':'Need help? '+esc(s.company.phone||s.company.email||'')}</div>`;
 try{VIEWS[state.view]()}catch(e){console.error(e);main(`<p class="bad">Error showing this page: ${esc(e.message)}</p>`)}}
function go(v){state.view=v;state.q='';document.body.classList.remove('navopen');render();scrollTo(0,0)}
function acctMenu(){modal('My account',`<div class="kv"><div><b>Name</b>${esc(ME.name)}</div><div><b>Email</b>${esc(ME.email)}</div><div><b>Role</b>${esc(ME.role)}</div></div><div class="acts" style="margin-top:14px"><button class="btn" onclick="cm(this);changePw()">Change password</button><button class="btn" onclick="cm(this);mfaSetup()">Two-step verification</button>${ME.kind==='staff'&&ME.role===SA?'<button class="btn" onclick="cm(this);setupScreen()">Connection setup</button>':''}<button class="btn bad" onclick="signOut()">Sign out</button></div>`)}
function changePw(){modal('Change password',`<div class="grid"><label class="fl full"><span>New password (at least 8 characters)</span><input id="np" type="password" autocomplete="new-password"></label><label class="fl full"><span>Confirm</span><input id="np2" type="password"></label></div>`,[{t:'Save',cls:'pri',fn:async m=>{const p=$('#np',m).value;if(p.length<8){toast('At least 8 characters',1);return false}if(p!==$('#np2',m).value){toast('Passwords do not match',1);return false}const {error}=await sb.auth.updateUser({password:p});if(error)throw error;toast('Password changed')}}])}
async function mfaSetup(){const {data:f}=await sb.auth.mfa.listFactors();const v=(f?.totp||[]).filter(x=>x.status==='verified');
 if(v.length){modal('Two-step verification',`<p class="okc">Two-step verification is on for your login.</p>`,[{t:'Turn off',cls:'bad',fn:async()=>{if(D.settings.security.requireMfa&&[SA,FO].includes(ME.role)){toast('Your role requires two-step verification.',1);return false}for(const x of v){const {error}=await sb.auth.mfa.unenroll({factorId:x.id});if(error)throw error}toast('Two-step verification turned off')}}]);return}
 const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Authenticator '+Date.now()});if(error)return toast(error.message,1);
 modal('Set up two-step verification',`<p>Scan with an authenticator app, then enter the 6-digit code.</p><img src="${data.totp.qr_code}" alt="QR code" style="width:200px;height:200px;display:block;margin:auto"><p class="hint mut" style="word-break:break-all">Setup key: ${esc(data.totp.secret)}</p><label class="fl"><span>Code</span><input id="mc" inputmode="numeric" maxlength="6"></label>`,[{t:'Verify',cls:'pri',fn:async m=>{const {error:e}=await sb.auth.mfa.challengeAndVerify({factorId:data.id,code:$('#mc',m).value.trim()});if(e)throw e;toast('Two-step verification is on')}}])}

/* ============================ NOTIFICATIONS ============================ */
function fillT(tpl,c,vars={}){const S=D.settings;const v=Object.assign({title:title(c),name:c?.name||'',fid:c?.fid||'',company:S.company.name,companyPhone:S.company.phone,branchPhone:S.as.phone||S.company.phone,pickupLocation:c?.pickupLoc||S.pickupLocations[0]||'',pickupHours:S.as.pickupHours,packages:'',code:'',balance:money(c?custBal(c.id):0),date:fd(today()),invoice:'',request:'',amount:''},vars);return String(tpl||'').replace(/\{(\w+)\}/g,(m,k)=>v[k]??m).replace(/ {2,}/g,' ').replace(/Dear\s+,/,'Dear ' + (v.name||'') + ',')}
const SUBJ={quoteReady:'Purchasing quotation ready',receivedUS:'Package received at U.S. warehouse',chargesDue:'Forwarding charges due',arrivedAS:'Package arrived in American Samoa',customsPending:'Package in customs processing',readyPickup:'Package ready for pickup',pickedUp:'Package pickup confirmation',deliveryScheduled:'Delivery scheduled'};
function pkgListText(ids){return ids.map(id=>{const p=pkg(id);return p?`- ${p.id}${p.tracking?' (tracking '+p.tracking+')':''}${p.desc?' – '+p.desc:''}`:'- '+id}).join('\n')}
function notify(custId,key,vars={}){const c=cust(custId);if(!c)return toast('No customer linked',1);const body=fillT(D.settings.templates[key],c,vars);const subj=`${SUBJ[key]||'Notice'} – ${c.fid}`;const ej=D.settings.emailjs;
 const m=modal('Notify customer',`<div class="grid"><label class="fl"><span>Email</span><input id="ne" value="${esc(c.email||'')}"></label><label class="fl"><span>Mobile</span><input id="nph" value="${esc(c.phone||'')}"></label><label class="fl full"><span>Subject</span><input id="ns" value="${esc(subj)}"></label><label class="fl full"><span>Message</span><textarea id="nb" rows="10">${esc(body)}</textarea></label></div><p class="hint mut">${ej.serviceId&&ej.templateId&&ej.publicKey?'Email is sent directly through EmailJS.':'Email opens your mail app (set up EmailJS in Settings to send directly).'} Text messages open your phone's messaging app.</p>`,[
  {t:'Send email',cls:'pri',fn:async m=>{const to=$('#ne',m).value.trim();if(!to){toast('No email address',1);return false}const s=$('#ns',m).value,b=$('#nb',m).value;
   if(ej.serviceId&&ej.templateId&&ej.publicKey){const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:ej.serviceId,template_id:ej.templateId,user_id:ej.publicKey,template_params:{to_email:to,to_name:c.name,subject:s,message:b,from_name:D.settings.company.name,reply_to:D.settings.company.email}})});if(!r.ok)throw new Error('EmailJS: '+await r.text());toast('Email sent')}
   else location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;
   await logNotice(c,key,'Email',to,s,b)}},
  {t:'Send text',fn:async m=>{const ph=$('#nph',m).value.trim();if(!ph){toast('No phone number',1);return false}const b=$('#nb',m).value;location.href=`sms:${ph.replace(/[^\d+]/g,'')}?&body=${encodeURIComponent(b)}`;await logNotice(c,key,'SMS',ph,'',b)}}])}
async function logNotice(c,key,channel,to,subject,body){try{const n={id:await nx('notification'),custId:c.id,key,channel,to,subject,body,at:now(),by:ME.name};await put('notifications',n);audit('Customer notified',c.fid,`${SUBJ[key]||key} via ${channel}`)}catch(e){console.warn(e)}}

VIEWS.dash=function(){const P=D.packages,S=D.settings;const n=f=>P.filter(f).length;
 const owed=D.invoices.filter(i=>!i.void).reduce((a,i)=>a+Math.max(0,invT(i).balance),0);
 const st=[['Customers',D.customers.length,'customers'],['Unidentified packages',n(p=>p.unidentified&&p.status<10),'receiving'],['At U.S. warehouse',n(p=>p.status>=4&&p.status<=7),'receiving'],['Awaiting shipping payment',n(p=>p.status===6),'finance'],['Shipments in transit',D.shipments.filter(s=>['Departed','In transit'].includes(s.status)).length,'shipments'],['In customs',n(p=>p.status===10||p.status===11),'branch'],['Ready for pickup',n(p=>p.status===14),'pickup'],['Deliveries open',D.deliveries.filter(d=>['Requested','Scheduled','Out for delivery'].includes(d.status)).length,'delivery'],['New purchase requests',D.requests.filter(r=>r.status==='Submitted').length,'requests'],['New online orders',D.orders.filter(o=>o.status==='Placed').length,'catalog'],['Outstanding balances',money(owed),'finance']];
 const allowed=k=>ME.role===SA||NAV.find(x=>x[0]===k)?.[2].includes(ME.role);
 const warn=[];if(ME.role===SA){if(S.company.name==='Your Company Name')warn.push('Enter your company name and contact details (Settings → Company).');if(!S.us.line1)warn.push('Enter the U.S. warehouse address customers will ship to (Settings → Locations).');if(!pricingSet())warn.push('Shipping rates and fees are all $0. Enter your actual contracted rates (Settings → Pricing) before quoting customers.');if(!S.as.phone)warn.push('Enter the American Samoa branch phone and pickup hours (Settings → Locations).');if(!S.policies.cmra)warn.push('Record your USPS CMRA / address-use status (Settings → Policies) before customers use the forwarding address.')}
 const recent=P.filter(p=>p.history?.length).sort((a,b)=>(b.history.at(-1).at||'').localeCompare(a.history.at(-1).at||'')).slice(0,10);
 main(`<div class="bar"><h2>Dashboard</h2><span class="sp"></span><span class="mut">${esc(ME.name)} · ${esc(ME.role)}</span></div>
 ${warn.length?`<div class="card" style="border-color:#f0c36d;background:#fffaf0"><b>Setup still needed</b><ul style="margin:6px 0 0;padding-left:18px">${warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
 <div class="stats">${st.filter(s=>allowed(s[2])).map(s=>`<div class="stat" onclick="go('${s[2]}')"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
 <div class="card"><h3>Quick actions</h3><div class="acts">${can(WM,WE)?`<button class="btn pri" onclick="go('receiving')">Receive package</button>`:''}${can(CS,WM,PA,BM)?`<button class="btn" onclick="editCustomer()">Register customer</button>`:''}${can(PA,CS)?`<button class="btn" onclick="editRequest()">New purchasing request</button>`:''}${can(WM,BM)?`<button class="btn" onclick="editShipment()">New shipment</button>`:''}${can(BM,CS)?`<button class="btn" onclick="go('pickup')">Release pickup</button>`:''}${can(FO)?`<button class="btn" onclick="go('finance')">Record payment</button>`:''}<button class="btn" onclick="go('tracking')">Track a package</button></div></div>
 <div class="card"><h3>Latest package activity</h3>${tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Customer',p=>esc(cl(cust(p.custId)))],['Status',p=>esc(STAT[p.status])],['Updated',p=>fdt(p.history.at(-1).at)],['By',p=>esc(p.history.at(-1).by)]],recent,p=>`pkgDetail('${p.id}')`,'No package activity yet.')}</div>`)};

 <div class="acts">${s.status==='Planning'&&can(WM)?`<button class="btn" onclick="cm(this);editShipment('${id}')">Edit</button><button class="btn pri" onclick="cm(this);addToShipment('${id}')">Add packages</button>`:''}${s.status==='Planning'&&pk.length&&can(WM)?`<button class="btn ok" onclick="cm(this);shpStatus('${id}','Departed')">Mark departed</button>`:''}${s.status==='Departed'?`<button class="btn" onclick="cm(this);shpStatus('${id}','In transit')">Mark in transit</button>`:''}${['Departed','In transit'].includes(s.status)&&can(BM,WM)?`<button class="btn ok" onclick="cm(this);shpStatus('${id}','Arrived')">Mark arrived in American Samoa</button>`:''}
 <button class="btn" onclick="preview(manifestDoc('${id}'))">Freight manifest</button><button class="btn" onclick="preview(shipmentReportDoc('${id}'))">Shipment report</button><button class="btn" onclick="preview(shipLabelsDoc('${id}'))">Shipping labels</button><button class="btn" onclick="preview(customsDoc('${id}'))">Customs records</button></div>
 ${tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Consolidation',p=>esc(p.conId||'')],['Customer',p=>esc(cl(cust(p.custId)))],['Contents',p=>esc(p.desc)],['Weight',p=>p.weight+' lb'],['Value',p=>p.value?money(p.value):''],['Status',p=>esc(STAT[p.status])],['',p=>s.status==='Planning'&&can(WM)?`<button class="btn sm ghost" onclick="event.stopPropagation();cm(this);removeFromShp('${id}','${p.id}')">Remove</button>`:'']],pk,p=>`pkgDetail('${p.id}')`,'No packages assigned yet.')}`,[],{wide:1})}
function addToShipment(id){const s=find('shipments',id);const el=shpEligible();if(!el.length)return toast(D.settings.requirePayBeforeShip?'No packages are ready. Packages must be paid (status "Prepared for transportation").':'No eligible packages.',1);const us=units(el);
 modal('Add packages to '+id,`<div class="cklist">${us.map(u=>`<label><input type="checkbox" class="su" value="${u.id}"><span><b>${u.id}</b> · ${esc(cl(cust(u.custId)))} · ${u.pkgIds.length} pkg · ${u.w} lb</span></label>`).join('')}</div>`,[{t:'Add selected',cls:'pri',fn:async m=>{const ids=[...m.querySelectorAll('.su:checked')].map(x=>x.value);if(!ids.length){toast('Select at least one',1);return false}const pk=us.filter(u=>ids.includes(u.id)).flatMap(u=>u.pkgIds);for(const pid of pk){const p=pkg(pid);p.shipId=id;setSt(p,7,'Assigned to shipment '+id);await put('packages',p)}s.pkgIds=[...new Set([...(s.pkgIds||[]),...pk])];await put('shipments',s);audit('Packages added to shipment',id,pk.join(', '));render();shpDetail(id)}}],{wide:1})}
async function removeFromShp(id,pid){const s=find('shipments',id),p=pkg(pid);const grp=p.conId?find('consolidations',p.conId).pkgIds:[pid];if(!confirm(`Remove ${grp.join(', ')} from ${id}?`))return;try{for(const g of grp){const q=pkg(g);q.shipId='';q.history.push({s:q.status,at:now(),by:ME.name,note:'Removed from shipment '+id});await put('packages',q)}s.pkgIds=s.pkgIds.filter(x=>!grp.includes(x));await put('shipments',s);audit('Package removed from shipment',id,grp.join(', '));render();shpDetail(id)}catch(e){toast(e.message,1)}}
function shpStatus(id,st){const s=find('shipments',id);const F=[{k:'at',label:'Actual date & time',type:'datetime-local',def:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),req:1},{k:'note',label:'Note',full:1}];
 modal(`${id}: ${st}`,formHTML(F),[{t:'Confirm',cls:'pri',fn:async m=>{const o=readForm(m,F);if(!o)return false;const at=new Date(o.at).toISOString();const ps={Departed:8,'In transit':9,Arrived:10}[st];
  for(const pid of s.pkgIds){const p=pkg(pid);if(p&&p.status<ps){setSt(p,ps,`Shipment ${id}${o.note?' · '+o.note:''}`);p.history.at(-1).at=at;await put('packages',p)}}
  s.status=st;if(st==='Departed')s.depAt=at;if(st==='Arrived')s.arrAt=at;(s.history=s.history||[]).push({s:st,at,by:ME.name,note:o.note});await put('shipments',s);audit('Shipment '+st.toLowerCase(),id,o.note);render();
  if(st==='Arrived'&&confirm('Notify customers that their packages arrived?'))notifyBatch(s.pkgIds,'arrivedAS')}}])}
function notifyBatch(ids,key,extra={}){const by={};ids.forEach(i=>{const p=pkg(i);if(p?.custId)(by[p.custId]=by[p.custId]||[]).push(i)});const cs=Object.keys(by);if(!cs.length)return;
 modal('Notify customers',`<p>${cs.length} customer(s). Open each notice:</p><div class="acts" style="flex-direction:column;align-items:stretch">${cs.map(c=>`<button class="btn" onclick="notify('${c}','${key}',{packages:pkgListText(${JSON.stringify(by[c]).replace(/"/g,"'")})})">${esc(cl(cust(c)))} (${by[c].length})</button>`).join('')}</div>`)}

/* ============================ AMERICAN SAMOA BRANCH ============================ */
VIEWS.branch=function(){const t=tabSel('br','arrivals');main(`<div class="bar"><h2>American Samoa Branch &amp; Customs</h2></div>${tabs('br',[['arrivals','Incoming freight'],['customs','Customs'],['storage','Branch receiving'],['sorting','Sorting']])}<div id="bb"></div>`);const b=$('#bb');
 if(t==='arrivals')b.innerHTML=tbl([['Shipment',s=>`<b>${esc(s.id)}</b>`],['Mode',s=>esc(s.mode)],['Carrier',s=>esc(s.carrier)],['Packages',s=>s.pkgIds.length],['ETA',s=>fd(s.eta)],['Arrived',s=>fdt(s.arrAt)],['Manifest check',s=>s.checked?'<span class="pill ok">Done</span>':'<span class="pill warn">Pending</span>'],['Status',s=>stPill(s.status)],['',s=>s.status==='Arrived'||s.status==='Received at branch'?`<button class="btn sm pri" onclick="event.stopPropagation();manifestCheck('${s.id}')">Check against manifest</button>`:'']],D.shipments.filter(s=>['Departed','In transit','Arrived','Received at branch'].includes(s.status)).sort((a,b)=>b.id.localeCompare(a.id)),s=>`shpDetail('${s.id}')`,'No incoming shipments.')+`<div class="row"><button class="btn" onclick="excessModal()">Record excess / unlisted package</button></div>`;
 if(t==='customs'){const r=D.packages.filter(p=>p.status>=10&&p.status<=12);b.innerHTML=`<div class="bar"><span class="sp"></span>${sbox('custmsList')}</div><div id="list"></div>`;custmsList()}
 if(t==='storage'){const a=D.packages.filter(p=>p.status===12),bb=D.packages.filter(p=>p.status===13);b.innerHTML=`<h4>Customs released – receive into branch storage</h4>${tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Customer',p=>esc(cl(cust(p.custId)))],['Released',p=>fdt(p.customs?.releasedAt)],['',p=>`<button class="btn sm pri" onclick="event.stopPropagation();branchReceive('${p.id}')">Receive</button>`]],a,p=>`pkgDetail('${p.id}')`,'Nothing waiting.')}
  <h4>In branch storage – mark ready for pickup</h4>${tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Customer',p=>esc(cl(cust(p.custId)))],['Location',p=>esc(p.asLocation)],['Balance',p=>money(pkgBalance(p))],['',p=>`<button class="btn sm ok" onclick="event.stopPropagation();markReady(['${p.id}'])">Ready for pickup</button>`]],bb,p=>`pkgDetail('${p.id}')`,'Nothing in storage.')}${bb.length>1?`<div class="row"><button class="btn ok" onclick="markReady(${JSON.stringify(bb.map(p=>p.id)).replace(/"/g,"'")})">Mark all ${bb.length} ready</button></div>`:''}`}
 if(t==='sorting'){const g=state.sortBy||'customer';b.innerHTML=`<div class="bar"><label class="fl" style="flex-direction:row;align-items:center;gap:8px"><span>Group by</span><select onchange="state.sortBy=this.value;render()">${[['customer','Customer'],['village','Village'],['island','Island'],['pickup','Pickup office'],['dest','Delivery destination']].map(([k,l])=>`<option value="${k}" ${g===k?'selected':''}>${l}</option>`).join('')}</select></label><span class="sp"></span><button class="btn" onclick="preview(sortDoc(state.sortBy||'customer'))">Print sorting list</button></div>${sortGroups(g).map(([k,ps])=>`<div class="grp"><h4>${esc(k)} (${ps.length})</h4>${tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Customer',p=>esc(cl(cust(p.custId)))],['Village',p=>esc(cust(p.custId)?.village)],['Location',p=>esc(p.asLocation)],['Status',p=>esc(STAT[p.status])]],ps,p=>`pkgDetail('${p.id}')`)}</div>`).join('')||'<p class="empty">No packages at the branch.</p>'}`}};
function custmsList(){const r=D.packages.filter(p=>p.status>=10&&p.status<=12&&qm(p.id,p.shipId,cust(p.custId)?.name,cust(p.custId)?.fid));$('#list').innerHTML=tbl([['Package',p=>`<b>${esc(p.id)}</b>`],['Shipment',p=>esc(p.shipId)],['Customer',p=>esc(cl(cust(p.custId)))],['Declared value',p=>p.customs?.value!=null&&p.customs.value!==''?money(p.customs.value):(p.value?money(p.value):'')],['Duties',p=>p.customs?.duties?money(p.customs.duties):''],['Customs status',p=>stPill(p.customs?.status||'Not started')],['Arrival check',p=>esc(p.asCheck?.result||'')]],r,p=>`customsModal('${p.id}')`,'No packages in customs.')}
function sortGroups(g){const ps=D.packages.filter(p=>p.status===13||p.status===14);const key=p=>{const c=cust(p.custId);return g==='customer'?cl(c):g==='village'?(c?.village||'—'):g==='island'?(c?.island||'—'):g==='pickup'?(c?.pickupLoc||'—'):(D.deliveries.find(d=>(d.pkgIds||[]).includes(p.id)&&!['Cancelled','Delivered'].includes(d.status))?'Home delivery – '+(c?.village||''):'Office pickup – '+(c?.pickupLoc||''))};const m={};ps.forEach(p=>(m[key(p)]=m[key(p)]||[]).push(p));return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))}
function manifestCheck(id){const s=find('shipments',id);const pk=s.pkgIds.map(pkg).filter(Boolean);
 modal('Check '+id+' against manifest',`<p class="hint">Mark every package listed on the manifest. Use "Record excess" for packages that arrived but are not on the manifest.</p><div class="tw"><table class="t"><thead><tr><th>Package</th><th>Customer</th><th>Weight</th><th>Result</th><th>Note</th></tr></thead><tbody>${pk.map(p=>`<tr><td><b>${p.id}</b></td><td>${esc(cl(cust(p.custId)))}</td><td>${p.weight} lb</td><td><select data-p="${p.id}" class="mr">${['Received','Missing','Damaged'].map(o=>`<option ${p.asCheck?.result===o?'selected':''}>${o}</option>`).join('')}</select></td><td><input data-n="${p.id}" value="${esc(p.asCheck?.note||'')}" style="width:100%"></td></tr>`).join('')}</tbody></table></div>`,[{t:'Save check',cls:'pri',fn:async m=>{for(const sel of m.querySelectorAll('.mr')){const p=pkg(sel.dataset.p);const note=$(`[data-n="${p.id}"]`,m).value.trim();const res=sel.value;if(p.asCheck?.result!==res||p.asCheck?.note!==note){p.asCheck={result:res,note,at:now(),by:ME.name};p.history.push({s:p.status,at:now(),by:ME.name,note:`Arrival check: ${res}${note?' – '+note:''}`});if(res==='Damaged')p.asCondition='Damaged on arrival';await put('packages',p)}}
  s.checked=true;s.checkedBy=ME.name;s.checkedAt=now();if(s.status==='Arrived')s.status='Received at branch';await put('shipments',s);const miss=pk.filter(p=>p.asCheck?.result==='Missing').length,dmg=pk.filter(p=>p.asCheck?.result==='Damaged').length;audit('Shipment checked against manifest',id,`${pk.length-miss} received, ${miss} missing, ${dmg} damaged`);render()}}],{wide:1})}
function excessModal(){const F=[{k:'shipId',label:'Arrived with shipment',type:'select',opts:D.shipments.map(s=>s.id)},{k:'tracking',label:'Tracking / label number'},{k:'fid',label:'Forwarding ID on label'},{k:'desc',label:'Description',full:1},{k:'weight',label:'Weight (lb)',type:'number',step:'0.01'},{k:'note',label:'Note',type:'textarea',full:1}];
 modal('Record excess / unlisted package',formHTML(F),[{t:'Save',cls:'pri',fn:async m=>{const o=readForm(m,F);if(!o)return false;const c=byFid(o.fid);const p=newPkgObj({id:await nx('package'),...o,custId:c?.id||null,unidentified:!c,excess:true,asCheck:{result:'Excess',note:o.note,at:now(),by:ME.name}});setSt(p,10,`Excess package found at branch (not on manifest ${o.shipId||''})${o.note?' – '+o.note:''}`);await put('packages',p);audit('Excess package recorded',p.id,o.shipId);render();pkgDetail(p.id)}}])}
function customsModal(id){const p=pkg(id);const c0=p.customs||{status:'Not started',desc:p.desc,value:p.value,origin:p.origin};const F=[{k:'invoiceRef',label:'Commercial invoice reference'},{k:'desc',label:'Product description',full:1},{k:'value',label:'Declared value (USD)',type:'number',step:'0.01',min:0},{k:'origin',label:'Country of origin',type:'select',opts:COUNTRIES},{k:'classification',label:'Product classification (if available)'},{k:'importDocs',label:'Import document references',full:1},{k:'duties',label:'Applicable duties & taxes (USD)',type:'number',step:'0.01',min:0},{k:'exam',label:'Examination',type:'select',opts:['Not selected','Selected for examination','Examined – no issues','Examined – held'],blank:false},{k:'status',label:'Customs status',type:'select',opts:CUS_ST,blank:false},{k:'payStatus',label:'Duty payment',type:'select',opts:['Not required','Due','Paid by customer','Paid by company'],blank:false},{k:'payRef',label:'Duty payment reference'},{k:'notes',label:'Notes',type:'textarea',full:1},{sec:'Release (only after actual clearance confirmation)'},{k:'releaseRef',label:'Clearance / release confirmation number'},{k:'releaseDate',label:'Release date',type:'date'},{k:'confirmed',label:'I confirm customs released this package (confirmation received)',type:'check',full:1}];
 modal('Customs record – '+id,`<p class="hint mut">Customer: ${esc(cl(cust(p.custId)))} · Shipment ${esc(p.shipId||'—')}</p>`+formHTML(F,c0),[c0.duties&&p.custId&&can(FO,BM)&&!p.dutyInvId?{t:'Bill duties to customer',fn:async()=>{await dutyInvoice(id);return true}}:null,{t:'Save',cls:'pri',fn:async m=>{const o=readForm(m,F);if(!o)return false;
  if(o.status==='Released'){if(!o.releaseRef||!o.releaseDate||!o.confirmed){toast('To release, enter the confirmation number, release date and tick the confirmation box.',1);return false}if(c0.status!=='Released'){o.releasedBy=ME.name;o.releasedAt=now()}}else{o.confirmed=false}
  const was=c0.status;p.customs=Object.assign({},c0,o);
  if(o.status==='Released'&&p.status<12)setSt(p,12,`Customs released · ref ${o.releaseRef}`);else if(['Pending','Under examination','Held'].includes(o.status)&&p.status<11)setSt(p,11,'Customs '+o.status.toLowerCase());else if(was!==o.status)p.history.push({s:p.status,at:now(),by:ME.name,note:'Customs status: '+o.status});
  await put('packages',p);audit('Customs record updated',id,`${o.status}${o.releaseRef?' ref '+o.releaseRef:''}`);render();if(was!==o.status&&['Pending','Under examination'].includes(o.status)&&p.custId&&confirm('Notify the customer about customs processing?'))notify(p.custId,'customsPending',{packages:pkgListText([id])})}}],{wide:1})}
async function dutyInvoice(id){const p=pkg(id);const d=+p.customs?.duties||0;if(!d)return toast('Enter duties first',1);const i={id:await nx('invoice'),custId:p.custId,type:'Customs/Branch',date:today(),lines:[{cat:'Customs charges',desc:`Duties & taxes for ${id}${p.customs.releaseRef?' (ref '+p.customs.releaseRef+')':''}`,qty:1,unit:d,pass:true}],pkgIds:[id],created:now(),by:ME.name};await put('invoices',i);p.dutyInvId=i.id;await put('packages',p);audit('Customs charges invoiced',i.id,id);render();invDetail(i.id)}
function branchReceive(id){const p=pkg(id);const F=[{k:'asLocation',label:'Branch storage location',type:'select',opts:D.settings.locAS,req:1}];modal('Receive into branch – '+id,formHTML(F),[{t:'Receive',cls:'pri',fn:async m=>{const o=readForm(m,F);if(!o)return false;p.asLocation=o.asLocation;setSt(p,13,'Received at branch · location '+o.asLocation);await put('packages',p);audit('Received at branch',id,o.asLocation);render()}}])}
async function markReady(ids){const bad=ids.filter(i=>{const p=pkg(i);return p.customs?.status!=='Released'||p.asCheck?.result==='Missing'||p.unidentified});if(bad.length)return toast(`Cannot mark ready: ${bad.join(', ')} (customs not released, missing, or unidentified).`,1);
 try{const by={};for(const i of ids){const p=pkg(i);const other=D.packages.find(x=>x.custId===p.custId&&x.status===14&&x.code);p.code=other?.code||by[p.custId]||String(Math.floor(100000+Math.random()*900000));by[p.custId]=p.code;setSt(p,14,'Ready for pickup');await put('packages',p)}audit('Packages ready for pickup',ids.join(', '));render();
  const cs=Object.keys(by);if(confirm(`Notify ${cs.length} customer(s) with their pickup code?`)){if(cs.length===1){const own=ids.filter(i=>pkg(i).custId===cs[0]);notify(cs[0],'readyPickup',{packages:pkgListText(own),code:by[cs[0]]})}else modal('Notify customers',`<div class="acts" style="flex-direction:column;align-items:stretch">${cs.map(c=>{const own=ids.filter(i=>pkg(i).custId===c);return `<button class="btn" onclick="notify('${c}','readyPickup',{packages:pkgListText(${JSON.stringify(own).replace(/"/g,"'")}),code:'${by[c]}'})">${esc(cl(cust(c)))}</button>`}).join('')}</div>`)}}catch(e){toast(e.message,1)}}

VIEWS.pickup=function(){main(`<div class="bar"><h2>Customer Pickup</h2><span class="sp"></span>${sbox('pickList','Search name, forwarding ID, phone, pickup code')}</div><div id="list"></div><h3 style="margin-top:18px">Recent pickups</h3>${tbl([['Receipt',u=>`<b>${esc(u.id)}</b>`],['Customer',u=>esc(cl(cust(u.custId)))],['Packages',u=>u.pkgIds.length],['Collected by',u=>esc(u.collector==='Customer'?'Customer':u.repName+' ('+u.repRel+')')],['Date',u=>fdt(u.at)],['Released by',u=>esc(u.by)]],D.pickups.slice().sort((a,b)=>b.id.localeCompare(a.id)).slice(0,25),u=>`preview(pickupDoc('${u.id}'))`,'No pickups yet.')}`);pickList()};
function pickList(){const by={};D.packages.filter(p=>p.status===14).forEach(p=>{const c=cust(p.custId);if(qm(c?.name,c?.fid,c?.phone,p.code,p.id))(by[p.custId]=by[p.custId]||[]).push(p)});
 $('#list').innerHTML=Object.keys(by).length?Object.entries(by).map(([cid,ps])=>{const c=cust(cid);const bal=r2(ps.reduce((a,p)=>a+pkgBalance(p),0));return `<div class="grp"><h4>${esc(cl(c))} · ${esc(c?.phone||'')}</h4><div style="padding:10px"><p>${ps.map(p=>`<a href="#" onclick="pkgDetail('${p.id}');return false">${p.id}</a> <small class="mut">(${esc(p.asLocation||'')})</small>`).join(', ')}</p><p>Balance on these packages: <b class="${bal>0?'bad':'okc'}">${money(bal)}</b></p><div class="acts"><button class="btn pri" onclick="releaseModal('${cid}')">Verify &amp; release</button></div></div></div>`}).join(''):'<p class="empty">No packages ready for pickup.</p>'}
function releaseModal(cid){const c=cust(cid);const ps=D.packages.filter(p=>p.custId===cid&&p.status===14);const reps=lines(c.reps);
 const m=modal('Release packages – '+cl(c),`<h4>Packages</h4><div class="cklist">${ps.map(p=>`<label><input type="checkbox" class="rp" value="${p.id}" checked><span><b>${p.id}</b> · ${esc(p.desc||'')} · ${esc(p.asLocation||'')} · balance ${money(pkgBalance(p))}</span></label>`).join('')}</div>
 <div id="balw"></div><div class="grid"><label class="fl"><span>Collected by</span><select id="rc"><option>Customer</option><option>Authorized representative</option></select></label><label class="fl"><span>Pickup code</span><input id="rcode" inputmode="numeric" maxlength="6"></label><label class="fl"><span>ID presented</span><select id="rid"><option value="">— Select —</option>${D.settings.idTypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label class="chk"><input type="checkbox" id="rver"> Photo ID checked and matches the person collecting</label></div>
 <div id="repw" class="grid" style="display:none;margin-top:8px"><label class="fl"><span>Representative name</span><input id="rn" list="repl"><datalist id="repl">${reps.map(r=>`<option value="${esc(r.split(/[–-]/)[0].trim())}">`).join('')}</datalist></label><label class="fl"><span>Relationship</span><input id="rr"></label><label class="fl full"><span>Authorization</span><select id="ra"><option value="">— Select —</option><option>Listed as authorized representative on customer profile</option><option>Written authorization from customer received</option><option>Customer authorized by phone (verified)</option></select></label></div>
 <p class="hint mut">Authorized on profile: ${esc(reps.join('; ')||'none')}</p><label class="fl full"><span>Notes</span><input id="rnote"></label><h4>Signature of person collecting</h4><canvas class="sig" id="rsig"></canvas><div><button class="btn sm ghost" type="button" id="rclr">Clear signature</button></div>`,[{t:'Release packages',cls:'ok',fn:async m=>{const ids=[...m.querySelectorAll('.rp:checked')].map(x=>x.value);if(!ids.length){toast('Select packages',1);return false}const sel=ids.map(pkg);
  if(sel.some(p=>p.customs?.status!=='Released')){toast('Customs release is not recorded for every selected package.',1);return false}const bal=r2(sel.reduce((a,p)=>a+pkgBalance(p),0));if(bal>0){toast(`Balance of ${money(bal)} must be paid before release.`,1);return false}

const REPORTS=[['daily','Daily sales',[FO]],['monthly','Monthly revenue',[FO]],['pnl','Profit & loss',[FO]],['outstanding','Outstanding balances',[FO]],['refunds','Refunds',[FO]],['purchasing','Purchasing costs',[FO]],['shipping','Shipping & freight costs',[FO,WM,BM]],['customs','Customs expenses & duties',[FO,BM]],['opex','Operating expenses',[FO]],['statement','Customer account statement',[FO]],['receiving','Warehouse receiving log',[WM]],['invUS','U.S. warehouse inventory',[WM]],['invAS','A.S. branch inventory',[BM]],['employee','Employee operational report',[]],['business','Monthly business report',[FO]]];
VIEWS.reports=function(){const avail=REPORTS.filter(r=>can(...r[2]));const k=state.rep||avail[0][0];main(`<div class="bar"><h2>Reports</h2></div><div class="card"><div class="grid"><label class="fl"><span>Report</span><select id="rk" onchange="state.rep=this.value;render()">${avail.map(r=>`<option value="${r[0]}" ${r[0]===k?'selected':''}>${r[1]}</option>`).join('')}</select></label>${k==='business'?`<label class="fl"><span>Month</span><input id="rm" type="month" value="${today().slice(0,7)}"></label>`:['invUS','invAS','outstanding'].includes(k)?'':`<label class="fl"><span>From</span><input id="rf" type="date" value="${today().slice(0,8)}01"></label><label class="fl"><span>To</span><input id="rt" type="date" value="${today()}"></label>`}${k==='statement'?`<label class="fl"><span>Customer</span><select id="rc">${custOpts().map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select></label>`:''}</div><div class="row"><button class="btn pri" onclick="runReport()">Preview report</button></div><p class="hint mut">Collections are split between company revenue and pass-through amounts (retailer, carrier and customs charges) in proportion to each invoice's lines.</p></div>`)};
function runReport(){const k=state.rep||REPORTS.filter(r=>can(...r[2]))[0][0];const f=$('#rf')?.value,t=$('#rt')?.value;
 const fn={daily:()=>dailyDoc(f,t),monthly:()=>monthlyDoc(f,t),pnl:()=>pnlDoc(f,t),outstanding:()=>outstandingDoc(),refunds:()=>refundsDoc(f,t),purchasing:()=>expCatDoc('Purchasing costs',e=>/retailers/.test(e.cat),f,t),shipping:()=>shippingDoc(f,t),customs:()=>customsExpDoc(f,t),opex:()=>expCatDoc('Operating expenses',e=>!e.pass,f,t),statement:()=>statementDoc($('#rc').value,f,t),receiving:()=>receivingLogDoc(f,t),invUS:()=>inventoryDoc('US'),invAS:()=>inventoryDoc('AS'),employee:()=>empDoc(f,t),business:()=>businessDoc($('#rm').value)}[k];preview(fn())}
function alloc(i,amt){const pos=(i.lines||[]).filter(l=>l.qty*l.unit>0);const tot=pos.reduce((a,l)=>a+l.qty*l.unit,0);const out={};if(!tot)return out;pos.forEach(l=>{out[l.cat]=(out[l.cat]||0)+amt*(l.qty*l.unit)/tot});return out}
function collections(f,t){const by={},pass={},comp={};let gross=0,refunds=0;D.payments.filter(p=>inR(p.date,f,t)).forEach(p=>{const i=inv(p.invId);if(!i)return;const sign=p.type==='refund'?-1:1;if(sign>0)gross+=+p.amount;else refunds+=+p.amount;const a=alloc(i,sign*p.amount);for(const c in a){by[c]=(by[c]||0)+a[c];(PASS_CATS.includes(c)?pass:comp)[c]=((PASS_CATS.includes(c)?pass:comp)[c]||0)+a[c]}});const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);return{by,pass,comp,gross:r2(gross),refunds:r2(refunds),passT:r2(sum(pass)),compT:r2(sum(comp))}}
